<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Appointment | Clinic Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard-layout">

    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-logo">+</div>
            <span>Clinic Dashboard</span>
        </div>

        <nav class="sidebar-nav">
            <a href="index.html" class="nav-item">
                <span>⌂</span>
                Dashboard
            </a>

            <a href="patients.html" class="nav-item">
                <span>♙</span>
                Patient Management
            </a>

            <a href="doctors.html" class="nav-item">
                <span>⚕</span>
                Doctor Management
            </a>

            <a href="appointments.html" class="nav-item active">
                <span>▣</span>
                Appointment Management
            </a>

            <a href="medical-records.html" class="nav-item">
                <span>▤</span>
                Medical Records
            </a>
        </nav>
    </aside>

    <main class="dashboard-main">

        <header class="dashboard-header">
            <div>
                <h1>Schedule Appointment</h1>
                <p>Appointment Management &nbsp;›&nbsp; Add Appointment</p>
            </div>

            <div class="dashboard-user">
                <span class="user-icon">●</span>
                <span>Admin</span>
                <a href="login.html" class="logout-button">Logout</a>
            </div>
        </header>

        <section class="form-page-section">

            <div id="appointmentForm" class="professional-form-card">

                <input type="hidden" id="appointmentId">

                <div class="form-section">
                    <h2>Appointment Details</h2>

                    <div class="form-grid two-columns">

                        <div class="form-group">
                            <label for="appointmentPatient">Patient</label>
                            <select id="appointmentPatient" required>
                                <option value="">Select patient</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="appointmentDoctor">Doctor</label>
                            <select id="appointmentDoctor" required>
                                <option value="">Select doctor</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="appointmentDate">Date</label>
                            <input type="date" id="appointmentDate" required>
                        </div>

                        <div class="form-group">
                            <label for="appointmentTime">Time</label>
                            <input type="time" id="appointmentTime" required>
                        </div>

                    </div>
                </div>

                <div class="form-section">
                    <h2>Visit Information</h2>

                    <div class="form-group">
                        <label for="appointmentReason">Reason for Visit</label>
                        <textarea id="appointmentReason" placeholder="Enter reason for visit" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="appointmentStatus">Status</label>
                        <select id="appointmentStatus" required>
                            <option value="Scheduled">Scheduled</option>
                            <option value="Completed">Completed</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <a href="appointments.html" class="cancel-button">← Cancel</a>
                    <button id="saveAppointmentButton">Save Appointment</button>
                </div>

            </div>

        </section>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
